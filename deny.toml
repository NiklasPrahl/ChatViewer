# cargo-deny: license allow-list, advisories, sources.
# Changes to the license allow-list require an ADR (see docs/adr/0001-license.md).

[graph]
all-features = true

[advisories]
yanked = "deny"
# Vulnerabilities fail everywhere; "unmaintained" notices only for our
# direct dependencies (Tauri's Linux GTK3 bindings pull in unmaintained
# crates we cannot replace). See ADR 0009.
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  # File-level copyleft, used unmodified by Tauri (Servo CSS parser). ADR 0009.
  "MPL-2.0",
]
# The Signal importer (and the fixture generator built on it) are the only
# places where AGPL-3.0 is accepted (ADR 0001).
exceptions = [
  { crate = "cv-import-signal", allow = ["AGPL-3.0-only"] },
  { crate = "fixture-gen", allow = ["AGPL-3.0-only"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
