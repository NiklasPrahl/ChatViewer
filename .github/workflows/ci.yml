name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secrets:
    name: Secret scan and hook self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan full history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner -v .
      - name: Hook self-test
        run: sh tools/ci/hook-selftest.sh

  detect:
    name: Detect workspace
    runs-on: ubuntu-latest
    outputs:
      has_crates: ${{ steps.check.outputs.has_crates }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if ls crates/*/Cargo.toml >/dev/null 2>&1; then
            echo "has_crates=true" >> "$GITHUB_OUTPUT"
          else
            echo "No crates yet; Rust jobs are skipped."
            echo "has_crates=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Rust (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.has_crates == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install WebKitGTK (Tauri on Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The Tauri crate embeds the built frontend at compile time.
      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: |
          npm ci
          npm test

  signal-crosscheck:
    name: Signal backups vs. libsignal validator
    needs: detect
    if: needs.detect.outputs.has_crates == 'true'
    runs-on: ubuntu-latest
    env:
      # libsignal is AGPL-3.0; it is built and run here only, never shipped.
      LIBSIGNAL_TAG: v0.106.1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Restore validator
        id: cache
        uses: actions/cache@v4
        with:
          path: libsignal-validator
          key: libsignal-validator-${{ env.LIBSIGNAL_TAG }}-${{ runner.os }}
      - name: Build libsignal validator
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$LIBSIGNAL_TAG" https://github.com/signalapp/libsignal.git "$RUNNER_TEMP/libsignal"
          cd "$RUNNER_TEMP/libsignal"
          cargo build --release -p libsignal-message-backup --features cli,test-util --bin validator
          cp target/release/validator "$GITHUB_WORKSPACE/libsignal-validator"
      - name: Cross-check
        run: sh tools/ci/signal-crosscheck.sh ./libsignal-validator

  deny:
    name: cargo-deny
    needs: detect
    if: needs.detect.outputs.has_crates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
