[package]
name = "cv-import-whatsapp"
version = "0.0.0"
description = "Importer for WhatsApp chat exports (.zip/.txt, iOS and Android)"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Synthetic export generator for tests and tools/fixture-gen.
synth = ["dep:rand"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
cv-core = { path = "../cv-core" }
cv-model = { path = "../cv-model" }
log = "0.4"
regex = "1"
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
rand = { version = "0.10", optional = true }

[dev-dependencies]
rand = "0.10"
tempfile = "3"

[[test]]
name = "variants"
required-features = ["synth"]

[lints]
workspace = true
