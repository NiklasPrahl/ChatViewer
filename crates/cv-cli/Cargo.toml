[package]
name = "cv-cli"
version = "0.0.0"
description = "chatviewer command-line tool"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "chatviewer"
path = "src/main.rs"

[features]
# Signal support links the AGPL-3.0 importer; release binaries are then
# AGPL-3.0 as a whole (ADR 0001). Build without it for an MIT-only binary.
default = ["signal"]
signal = ["dep:cv-import-signal"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
cv-core = { path = "../cv-core" }
cv-cva = { path = "../cv-cva" }
cv-import-signal = { path = "../cv-import-signal", optional = true }
rpassword = "7"
cv-export = { path = "../cv-export" }
cv-import-whatsapp = { path = "../cv-import-whatsapp" }
cv-model = { path = "../cv-model" }
log = "0.4"

[dev-dependencies]
cv-import-signal = { path = "../cv-import-signal", features = ["writer"] }
rand = "0.9"
cv-import-whatsapp = { path = "../cv-import-whatsapp", features = ["synth"] }
tempfile = "3"

[lints]
workspace = true
